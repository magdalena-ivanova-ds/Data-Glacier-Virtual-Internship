openapi: 3.0.3
info:
  title: House Price API
  version: "1.0.0"
paths:
  /predict:
    post:
      summary: Predict house price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                features:
                  type: object
                  additionalProperties: { type: number }
                  example:
                    rooms: 6
                    area_sqm: 250
                    age_years: 1
                    distance_km: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  prediction: { type: number }
        '400':
          description: Invalid input
